<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #dim { position: fixed; inset: 0; opacity: 0; transition: opacity .8s ease;
      background: radial-gradient(ellipse at center, rgba(2,1,0,.9) 0%, rgba(2,1,0,.76) 42%, rgba(2,1,0,.55) 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* every card arrives the same way: pixel blocks leave the globe and settle where the card will be, then the card is there */
  @keyframes asIn { 0%, 52% { opacity: 0; } }
  /* the type-in console: a line drops from the globe to a slim bar; contacts suggest above it */
  #tc { position: fixed; left: 50%; transform: translateX(-50%); visibility: hidden; opacity: 0; transition: opacity .25s ease, visibility 0s linear .25s; font-family: "SF Mono", Menlo, monospace; color: #ffdea5; }
  #tc.on { visibility: visible; opacity: 1; transition: none; }
  #tcLine { position: absolute; left: 50%; bottom: 100%; width: 1px; height: 0; background: rgba(255,145,35,.7); transition: height .28s cubic-bezier(.2,.8,.2,1); }
  #tc.on #tcLine { height: var(--drop); }
  #tcBar { position: relative; box-sizing: border-box; height: var(--h); display: flex; align-items: center; gap: .9em; padding: 0 1.1em;
      background: rgba(10,5,1,.88); border: 1px solid rgba(255,145,35,.5); }
  #tc.on #tcBar { animation: asIn .75s ease backwards; }
  #tcBar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgba(255,145,35,.95); }
  #tcLabel { color: rgba(255,145,35,.85); letter-spacing: .08em; text-transform: uppercase; font-size: .78em; white-space: nowrap; }
  #tcIn { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #fff3dc; font: inherit; caret-color: #ffb347; caret-shape: block; letter-spacing: .02em; }
  #tcHint { color: rgba(255,145,35,.55); font-size: .72em; white-space: nowrap; }
  #tcLabel, #tcIn, #tcHint { opacity: 0; transition: opacity .25s ease .5s; }
  #tc.on #tcLabel, #tc.on #tcIn, #tc.on #tcHint { opacity: 1; }
  #tcList { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); display: flex; flex-direction: column-reverse; gap: 4px; }
  .tcItem { display: flex; justify-content: space-between; gap: 1em; padding: .45em 1.1em; background: rgba(10,5,1,.96); border: 1px solid rgba(255,145,35,.28);
      font-size: .85em; cursor: default; animation: tcIn .22s ease both; }
  .tcItem b { font-weight: 500; color: #fff3dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcItem span { color: rgba(255,190,110,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcItem.sel { border-color: rgba(255,170,60,.9); background: rgba(40,18,2,.92); }
  @keyframes tcIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* the compose card: the whole email beside the globe; only his own click or ⌘↵ sends it */
  #cc { position: fixed; box-sizing: border-box; display: flex; flex-direction: column; gap: .55em; padding: 1em 1.15em 1.05em; visibility: hidden; opacity: 0;
      transition: opacity .25s ease, visibility 0s linear .25s;
      font-family: "SF Mono", Menlo, monospace; color: #ffdea5; background: rgba(10,5,1,.92); border: 1px solid rgba(255,145,35,.5); }
  #cc.on { visibility: visible; opacity: 1; transition: none; animation: asIn .8s ease backwards; }
  #cc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgba(255,145,35,.95); }
  #ccHead { display: flex; align-items: baseline; gap: .8em; }
  #ccHead b { color: rgba(255,145,35,.95); letter-spacing: .1em; font-weight: 500; font-size: .82em; }
  #ccHead span { color: rgba(255,145,35,.55); font-size: .72em; flex: 1; }
  #ccX { color: rgba(255,170,80,.7); cursor: default; font-size: .9em; padding: 0 .2em; }
  #ccX:hover { color: #fff3dc; }
  .ccRow { display: flex; align-items: flex-start; gap: .7em; border-bottom: 1px solid rgba(255,145,35,.18); padding-bottom: .4em; position: relative; }
  .ccRow[hidden] { display: none; }
  .ccRow > label { flex: 0 0 4.2em; color: rgba(255,145,35,.75); font-size: .74em; letter-spacing: .08em; text-transform: uppercase; padding-top: .35em; }
  .ccPeople { flex: 1; display: flex; flex-wrap: wrap; gap: .35em; min-width: 0; }
  .ccChip { display: inline-flex; gap: .45em; align-items: center; padding: .12em .5em; font-size: .86em; background: rgba(255,145,35,.12); border: 1px solid rgba(255,145,35,.35); color: #fff3dc; max-width: 100%; }
  .ccChip.unconf { border-style: dashed; border-color: rgba(255,190,90,.9); background: rgba(255,145,35,.05); cursor: default; }
  .ccChip.unconf::after { content: "?"; color: #ffb347; font-weight: 600; }
  .ccChip small { color: rgba(255,170,80,.65); font-size: .8em; }
  .ccChip.bad { border-style: dashed; border-color: rgba(255,90,60,.8); color: #ffb9a0; }
  .ccChip i { font-style: normal; color: rgba(255,170,80,.7); cursor: default; }
  .ccChip i:hover { color: #fff3dc; }
  #cc input, #cc textarea { background: transparent; border: 0; outline: 0; color: #fff3dc; font: inherit; caret-color: #ffb347; min-width: 6em; }
  .ccPeople input { flex: 1; font-size: .9em; padding: .15em 0; }
  #ccSubject { flex: 1; padding: .15em 0; }
  #ccBody { flex: 1; resize: none; min-height: 9em; line-height: 1.45; font-size: .92em; padding: .2em 0; }
  #ccMore[hidden] { display: none; }
  #ccMore { color: rgba(255,145,35,.6); font-size: .72em; cursor: default; padding-top: .45em; white-space: nowrap; }
  #ccMore:hover { color: #ffdea5; }
  #ccFiles { flex: 1; display: flex; flex-wrap: wrap; gap: .35em; align-items: center; }
  .ccBtn { padding: .3em .9em; border: 1px solid rgba(255,145,35,.45); color: #ffdea5; font-size: .8em; letter-spacing: .06em; cursor: default; background: transparent; font-family: inherit; }
  .ccBtn:hover { border-color: rgba(255,170,60,.95); color: #fff3dc; }
  #ccSend { background: rgba(255,145,35,.9); color: #1a0c00; border-color: rgba(255,145,35,.95); font-weight: 600; }
  #ccSend:hover { background: #ffb347; }
  #ccSend:disabled { opacity: .35; }
  #ccFoot { display: flex; align-items: center; gap: .7em; }
  #ccMsg { flex: 1; font-size: .74em; color: rgba(255,170,80,.8); min-height: 1.2em; }
  #ccMsg.err { color: #ff9a7a; }
  #ccList { position: absolute; left: 4.9em; right: 0; top: 100%; z-index: 2; display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
  #cc.drop { border-color: rgba(255,200,110,1); box-shadow: 0 0 0 1px rgba(255,200,110,.6) inset; }
  /* the step cards: one per task step, right of the globe */
  #scs { position: fixed; display: flex; flex-direction: column; font-family: "SF Mono", Menlo, monospace; color: #ffdea5; pointer-events: none; }
  .sc { position: relative; box-sizing: border-box; display: flex; align-items: center; gap: .9em; padding: 0 .9em; font-weight: 500;
      background: rgba(10,5,1,.88); border: 1px solid rgba(255,145,35,.45); animation: asIn .75s ease backwards; }
  .sc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgba(255,145,35,.95); }
  .sc i { font-style: normal; color: rgba(255,145,35,.7); }
  .sc span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff3dc; }
  .sc u { text-decoration: none; display: inline-block; animation: scType .45s steps(18) .38s backwards; }
  .sc em { display: flex; align-items: center; justify-content: center; width: 1em; font-style: normal; }
  .sc em b { width: .62em; height: .62em; background: #ffdea5; animation: scBeat 1s ease-in-out infinite; }
  .sc.done { opacity: .62; }
  .sc.done em b { animation: none; background: none; width: auto; height: auto; font-weight: 500; }
  .sc.done em b::after { content: "✓"; }
  @keyframes scBeat { 0%, 100% { opacity: .25; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes scType { from { clip-path: inset(0 100% 0 0); } }
</style>
</head>
<body>
<div id="dim"></div>
<canvas id="hudBack"></canvas>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="scs"></div>
<div id="tc"><div id="tcLine"></div><div id="tcList"></div>
  <div id="tcBar"><span id="tcLabel"></span><input id="tcIn" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="tcHint">↵ send · esc</span></div></div>
<div id="cc"><div id="ccHead"><b id="ccTitle">EMAIL</b><span id="ccVia">via Apple Mail · Gmail</span><span id="ccX" title="Close (esc)">✕</span></div>
  <div class="ccRow" data-k="to"><label>To</label><div class="ccPeople"><input></div><span id="ccMore">CC / BCC</span></div>
  <div class="ccRow" data-k="cc" hidden><label>CC</label><div class="ccPeople"><input></div></div>
  <div class="ccRow" data-k="bcc" hidden><label>BCC</label><div class="ccPeople"><input></div></div>
  <div class="ccRow" data-k="subject"><label>Subject</label><input id="ccSubject" spellcheck="true"></div>
  <div class="ccRow" data-k="body" style="flex:1"><textarea id="ccBody" spellcheck="true"></textarea></div>
  <div class="ccRow" data-k="files"><label>Files</label><div id="ccFiles"><button class="ccBtn" id="ccAttach">+ Attach</button></div></div>
  <div id="ccFoot"><span id="ccMsg"></span><button class="ccBtn" id="ccCancel">Cancel</button><button class="ccBtn" id="ccSend">Send ⌘↵</button></div></div>
<script>
'use strict';
// =====================================================================
// JARVIS: a globe of amber pixel blocks around a tangled core of light. The only text: task step cards beside it.
// API for the app: jarvis.wake(), jarvis.sleep(), jarvis.state('idle'|'listen'|'think'|'speak'), jarvis.level(0..1), jarvis.step('Opening Chrome')
// =====================================================================
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: true });
const hudBack = document.getElementById('hudBack'), hb = hudBack.getContext('2d');
const hud = document.getElementById('hud'), hx = hud.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const c of [cv, hud, hudBack]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
}
addEventListener('resize', resize); resize();

// ----------------------------- shaders -----------------------------
// aPos: a direction on the globe (world layer), a flat position (screen layer), or a final position (live parts).
// aP: radius, seed (<0: live), size (blocks: -(type*100+size); type 1 = along the ring, 2 = pointing out, 3 = square), brightness.
const VS = `
attribute vec3 aPos; attribute vec4 aP;
uniform float uT, uLevel, uGather, uBurst, uCore, uAspect, uScale, uPx, uFade, uHeat, uIsLine, uView;
uniform float uListen, uPulseR, uPulseA;   // alive: ripples with his voice, a pulse through the rings
uniform vec2 uOff;
uniform mat3 uRot, uRotZ;
varying float vA, vHot, vType, vAng;
float h(float n) { return fract(sin(n) * 43758.5453); }
vec3 spinY(vec3 v, float a) { float c = cos(a), s = sin(a); return vec3(v.x * c - v.z * s, v.y, v.x * s + v.z * c); }
void main() {
  float s = aP.y, live = step(s, 0.0), R0 = aP.x;
  float core = step(R0, 0.3) * (1.0 - live);
  float shell = (1.0 - live) * (1.0 - core);
  float len = max(length(aPos), 0.0001);
  vec3 nd = aPos / len;
  // calm: a slow breath, and a gentle swell with the voice
  float r = R0 * (1.0 + shell * (uLevel * 0.018 + 0.006 * sin(uT * 0.9)));
  r *= mix(1.0, uCore, core);
  vec3 p = aPos * r;
  // forming: the globe spirals in; the pixel ring assembles around the circle
  float ang = atan(nd.y, nd.x);
  float delay = mix(h(s + 5.0) * 0.35 + (0.5 - 0.5 * nd.y) * 0.3, fract(ang / 6.2832 + 0.3) * 0.5 + h(s + 5.0) * 0.12, uView);
  float g = mix(1.0, clamp(uGather * 1.7 - delay, 0.0, 1.0), shell);
  float ge = 1.0 - pow(1.0 - g, 3.0);
  vec3 q = p * (1.0 + (1.0 - ge) * (0.5 + h(s + 4.0) * 0.9) * (1.0 - uIsLine * 0.5));
  p = mix(spinY(q, (1.0 - ge) * (1.0 - ge) * 2.4), q, uView);
  p *= 1.0 + uBurst * shell * (0.2 + h(s + 8.0) * 0.8);   // signing off: drift outward and fade
  p = mix(uRot * p, uRotZ * p, uView);
  // alive: while he talks the ring ripples with his voice; a pulse rolls through on "got it" and on each task step
  float sa = atan(p.y, p.x), wave = 0.5 + 0.5 * sin(sa * 7.0 - uT * 5.0 + h(s + 2.0) * 0.8);
  p *= 1.0 + uView * uListen * uLevel * 0.06 * wave;
  float pr = length(p.xy) - uPulseR, pulse = uPulseA * exp(-pr * pr * 160.0);
  float alive = 1.0 + uListen * uLevel * 1.2 * wave * (0.4 + 0.6 * uView) + pulse * 2.2;
  float z = 3.2 - p.z;
  gl_Position = vec4((p.x * (3.2 / z) * uScale + uOff.x) / uAspect, p.y * (3.2 / z) * uScale + uOff.y, 0.0, 1.0);
  vec3 rd = uRot * nd;
  float rim = mix(0.1 + 1.45 * pow(1.0 - abs(rd.z), 2.2), 1.0, clamp(live + core + uView, 0.0, 1.0));   // light gathers at the edge
  float depth = mix(0.5 + 0.5 * clamp(0.5 + p.z * 0.6, 0.0, 1.0), 1.0, uView);
  float az = abs(aP.z), type = aP.z < 0.0 ? floor(az / 100.0) : 0.0, size = az - type * 100.0;
  gl_PointSize = size * uPx * (3.2 / z);
  vA = 2.1 * aP.w * rim * depth * uFade * (1.0 + uLevel * 0.45) * (1.0 + (1.0 - ge) * shell * 1.2)
       * pow(1.0 - uBurst * shell, 2.0) * mix(1.0, ge * ge, uIsLine * shell) * alive;
  vHot = clamp(aP.w - 0.55 + uLevel * 0.15 + uHeat + (alive - 1.0) * 0.12, 0.0, 1.0);
  vType = type;
  vAng = atan(gl_Position.y, gl_Position.x * uAspect);
}`;
const PALETTE = `
vec3 amber(float hot) {   // deep ember -> orange -> gold -> near white
  vec3 a = mix(vec3(0.78, 0.24, 0.02), vec3(1.0, 0.52, 0.06), smoothstep(0.0, 0.35, hot));
  a = mix(a, vec3(1.0, 0.78, 0.3), smoothstep(0.35, 0.75, hot));
  return mix(a, vec3(1.0, 0.96, 0.82), smoothstep(0.78, 1.0, hot));
}`;
const FS_POINT = `precision mediump float;
varying float vA, vHot, vType, vAng;
${PALETTE}
void main() {
  vec2 c = gl_PointCoord - 0.5; c.y = -c.y;
  float a;
  if (vType < 0.5) a = pow(smoothstep(0.5, 0.0, length(c)), 1.4);
  else {
    float cs = cos(vAng), sn = sin(vAng);
    vec2 q = vec2(c.x * cs + c.y * sn, -c.x * sn + c.y * cs);       // x: outward from the centre, y: along the ring
    vec2 hw = vType < 1.5 ? vec2(0.12, 0.46) : (vType < 2.5 ? vec2(0.46, 0.12) : vec2(0.3, 0.3));
    vec2 e = smoothstep(hw + 0.035, hw - 0.015, abs(q));
    a = e.x * e.y;
  }
  a *= vA;
  gl_FragColor = vec4(amber(vHot) * a, a);
}`;
const FS_LINE = `precision mediump float;
varying float vA, vHot, vType, vAng;
uniform float uLineGain;
${PALETTE}
void main() { float a = vA * uLineGain; gl_FragColor = vec4(amber(vHot + 0.05) * a, a); }`;
const VQ = `attribute vec2 aQ; varying vec2 vUv; void main() { vUv = aQ * 0.5 + 0.5; gl_Position = vec4(aQ, 0.0, 1.0); }`;
const FS_BLUR = `precision mediump float; varying vec2 vUv; uniform sampler2D uTex; uniform vec2 uDir;
void main() { vec4 c = texture2D(uTex, vUv) * 0.227027;
  c += (texture2D(uTex, vUv + uDir * 1.3846) + texture2D(uTex, vUv - uDir * 1.3846)) * 0.316216;
  c += (texture2D(uTex, vUv + uDir * 3.2308) + texture2D(uTex, vUv - uDir * 3.2308)) * 0.070270;
  gl_FragColor = c; }`;
const FS_COMP = `precision mediump float; varying vec2 vUv; uniform sampler2D uTex; uniform float uGain;
void main() { vec3 c = texture2D(uTex, vUv).rgb * uGain; float a = clamp(max(c.r, max(c.g, c.b)), 0.0, 1.0); gl_FragColor = vec4(min(c, vec3(a)), a); }`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(vs, fs, names, attrs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = { p }; for (const n of names) u[n] = gl.getUniformLocation(p, n); return u;
}
const GEO_U = ['uT', 'uLevel', 'uGather', 'uBurst', 'uCore', 'uAspect', 'uScale', 'uPx', 'uFade', 'uHeat', 'uIsLine', 'uView', 'uOff', 'uRot', 'uRotZ', 'uLineGain',
               'uListen', 'uPulseR', 'uPulseA'];
const PTS = program(VS, FS_POINT, GEO_U, ['aPos', 'aP']), LNS = program(VS, FS_LINE, GEO_U, ['aPos', 'aP']);
const BLUR = program(VQ, FS_BLUR, ['uTex', 'uDir'], ['aQ']), COMP = program(VQ, FS_COMP, ['uTex', 'uGain'], ['aQ']);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.clearColor(0, 0, 0, 0);

// ----------------------------- geometry -----------------------------
let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += rnd(); return (u - 2) / 2; };
function unit() { const z = rnd() * 2 - 1, a = rnd() * Math.PI * 2, r = Math.sqrt(1 - z * z); return [r * Math.cos(a), r * Math.sin(a), z]; }
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const along = (d, t, k) => norm([d[0] + t[0] * k, d[1] + t[1] * k, d[2] + t[2] * k]);
function rotate(v, axis, ang) {
  const c = Math.cos(ang), s = Math.sin(ang), d = dot(v, axis), x = cross(axis, v);
  return [v[0] * c + x[0] * s + axis[0] * d * (1 - c), v[1] * c + x[1] * s + axis[1] * d * (1 - c), v[2] * c + x[2] * s + axis[2] * d * (1 - c)];
}
const ih = (x, y, z) => { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf), L = (a, b, t) => a + (b - a) * t;
  return L(L(L(ih(xi, yi, zi), ih(xi + 1, yi, zi), u), L(ih(xi, yi + 1, zi), ih(xi + 1, yi + 1, zi), u), v),
           L(L(ih(xi, yi, zi + 1), ih(xi + 1, yi, zi + 1), u), L(ih(xi, yi + 1, zi + 1), ih(xi + 1, yi + 1, zi + 1), u), v), w);
}
const fbm3 = d => 0.55 * vnoise(d[0] * 2.3 + 11, d[1] * 2.3 + 3, d[2] * 2.3 + 7) + 0.3 * vnoise(d[0] * 4.6 + 1, d[1] * 4.6, d[2] * 4.6) + 0.15 * vnoise(d[0] * 9.1, d[1] * 9.1 + 2, d[2] * 9.1);
const clump = d => Math.max(0, Math.min(1, (fbm3(d) - 0.4) / 0.22));
function clustered() { for (;;) { const d = unit(), c = clump(d); if (rnd() < 0.05 + 0.95 * c) return [d, c]; } }
const ring1 = a => Math.max(0, Math.min(1, (0.55 * vnoise(Math.cos(a) * 3 + 5, Math.sin(a) * 3 + 9, 1.5) + 0.3 * vnoise(Math.cos(a) * 7, Math.sin(a) * 7, 4.2) + 0.15 * vnoise(Math.cos(a) * 15, Math.sin(a) * 15, 7.7) - 0.36) / 0.26));
function ringAngle() { for (;;) { const a = rnd() * Math.PI * 2, c = ring1(a); if (rnd() < 0.08 + 0.92 * c) return [a, c]; } }

function mesh() { return { pos: [], par: [] }; }
const block = (type, size) => -(type * 100 + size);
const sd = () => rnd() * 1000 + 1;
function vert(m, p, radius, size, bright, s) { m.pos.push(p[0], p[1], p[2]); m.par.push(radius, s, size, bright); }
const LW = mesh(), LV = mesh(), PW = mesh(), PV = mesh();   // lines and points; world (turning globe) and screen (flat ring)

// --- the globe: clumps of pixel blocks, like lit city blocks ---
for (let c = 0; c < 2100; c++) {

  const e = T - phaseAt;
  if (phase === 'off') return { core: 0, gather: 0, burst: 0, arcs: 0, hud: 0, shock: -1, fade: 0 };
  if (phase === 'waking') {   // core lights, a soft shockwave, the globe and ring assemble, the arcs and frame draw in
    once('ignite', e > 0.05, () => { flash = 0.7; });
    if (e > 2.4) phase = 'on';
    return { core: backOut(e / 0.6), gather: clamp01((e - 0.25) / 1.3), burst: 0, arcs: easeIO((e - 0.7) / 1.0), hud: ease((e - 1.1) / 1.0), shock: e < 1.4 ? e / 1.4 : -1, fade: 1 };
  }
  if (phase === 'leaving') {   // frame and arcs fold away, the blocks drift out and fade, the core goes out last
    once('out', e > 0.85, () => { flash = 0.8; dimEl.style.opacity = 0; });
    if (e > 1.3) { phase = 'off'; return timeline(); }
    return { core: e < 0.7 ? 1 : 1 - ease((e - 0.7) / 0.5), gather: 1, burst: ease((e - 0.15) / 0.85), arcs: 1 - easeIO(e / 0.55), hud: 1 - ease(e / 0.35), shock: -1, fade: 1 };
  }
  return { core: 1, gather: 1, burst: 0, arcs: 1, hud: 1, shock: -1, fade: 1 };
}

// ----------------------------- frame and background disc (2D, no text) -----------------------------
function drawBack() {   // the big faint disc behind the globe was removed (Mahmoud, 07/11); this layer stays empty
  hb.setTransform(DPR, 0, 0, DPR, 0, 0); hb.clearRect(0, 0, W, H);
}
function drawHud(R, cx, cy, tl) {
  hx.setTransform(DPR, 0, 0, DPR, 0, 0); hx.clearRect(0, 0, W, H);
  hx.lineCap = 'butt';
  if (tl.shock >= 0) {
    const k = ease(tl.shock), r = R * (0.15 + k * 1.6), a = Math.pow(1 - tl.shock, 2) * 0.55;
    hx.strokeStyle = `rgba(255,190,100,${a})`; hx.lineWidth = 1 + (1 - tl.shock) * 3; hx.beginPath(); hx.arc(cx, cy, r, 0, Math.PI * 2); hx.stroke();
  }
  const p = tl.hud;
  if (p > 0.001) {
    const c = a => `rgba(255,145,35,${Math.min(1, a)})`, grow = (x0, x1) => x0 + (x1 - x0) * p;
    // top bar: a dark band, a bright rule, a lit block, and a small end box
    const ty = cy - R * 1.13, tx0 = cx - R * 1.5, tx1 = cx + R * 0.38;
    hx.fillStyle = c(0.16 * p); hx.fillRect(tx0, ty - 9, grow(0, tx1 - tx0), 9);
    hx.fillStyle = c(0.7 * p); hx.fillRect(tx0, ty, grow(0, tx1 - tx0), 2);
    hx.fillStyle = c(0.45 * p); hx.fillRect(tx0, ty + 3, grow(0, (tx1 - tx0) * 0.24), 3);
    if (p > 0.6) {
      const k = (p - 0.6) / 0.4;
      hx.fillStyle = c(0.8 * k); hx.fillRect(tx1 - R * 0.36, ty - 8, R * 0.1, 7);
      hx.strokeStyle = c(0.6 * k); hx.lineWidth = 1; hx.strokeRect(tx1 - R * 0.22, ty - 9, R * 0.16, 9);
      hx.fillStyle = c(0.9 * k); hx.fillRect(tx1 - R * 0.1, ty - 6, 2, 2); hx.fillRect(tx1 - R * 0.1, ty - 3, 2, 2);
    }
    // left rails
    hx.fillStyle = c(0.55 * p); hx.fillRect(cx - R * 1.7, cy - R * 0.58, grow(0, R * 0.75), 2);
    hx.fillStyle = c(0.22 * p); hx.fillRect(cx - R * 1.7, cy - R * 0.54, grow(0, R * 0.6), 1);
    hx.fillStyle = c(0.25 * p); hx.fillRect(cx - R * 1.42, cy - R * 0.95, 1, grow(0, R * 2.05));
    // right bracket and rail
    hx.strokeStyle = c(0.4 * p); hx.lineWidth = 1.5; hx.beginPath();
    hx.moveTo(cx + R * 0.98, cy - R * 0.64); hx.lineTo(grow(cx + R * 0.98, cx + R * 1.28), cy - R * 0.64);
    hx.lineTo(cx + R * 1.28, grow(cy - R * 0.64, cy + R * 1.0)); hx.stroke();
    hx.fillStyle = c(0.6 * p); hx.fillRect(cx + R * 1.62, cy - R * 1.13, 3, grow(0, R * 0.95));
    // bottom-right gauge
    const gx = cx + R * 1.58, gy = cy + R * 1.08, gr = R * 0.11 * p;
    hx.strokeStyle = c(0.5 * p); hx.lineWidth = 1; hx.beginPath(); hx.arc(gx, gy, gr, 0, Math.PI * 2); hx.stroke();
    hx.strokeStyle = c(0.8 * p); hx.lineWidth = 2; hx.beginPath(); hx.arc(gx, gy, gr * 0.7, gaugeClock, gaugeClock + Math.PI * (0.6 + level * 0.8)); hx.stroke();
    for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2 - gaugeClock * 0.4; hx.strokeStyle = c((i % 6 ? 0.3 : 0.7) * p); hx.beginPath(); hx.moveTo(gx + Math.cos(a) * gr * 1.08, gy + Math.sin(a) * gr * 1.08); hx.lineTo(gx + Math.cos(a) * gr * 1.22, gy + Math.sin(a) * gr * 1.22); hx.stroke(); }
    hx.fillStyle = c(0.9 * p); hx.beginPath(); hx.arc(gx, gy, 2.5, 0, Math.PI * 2); hx.fill();
  }
  drawInflow(R, cx, cy); drawVoice(R, cx, cy); drawWave(R, cx, cy); drawCards(R, cx, cy, p);
  if (flash > 0.01) {
    const gR = R * (0.25 + flash * 0.55), g = hx.createRadialGradient(cx, cy, 0, cx, cy, gR);
    g.addColorStop(0, `rgba(255,235,190,${flash * 0.7})`); g.addColorStop(0.4, `rgba(255,150,40,${flash * 0.2})`); g.addColorStop(1, 'rgba(255,110,20,0)');
    hx.fillStyle = g; hx.beginPath(); hx.arc(cx, cy, gR, 0, Math.PI * 2); hx.fill();
  }
}

// ----------------------------- render -----------------------------
const mat = (a, tilt) => { const cy = Math.cos(a), sy = Math.sin(a), cx = Math.cos(tilt), sx = Math.sin(tilt); return [cy, sx * sy, -cx * sy, 0, cx, sx, sy, -sx * cy, cx * cy]; };
const matZ = a => [Math.cos(a), Math.sin(a), 0, -Math.sin(a), Math.cos(a), 0, 0, 0, 1];
let rotW = mat(0, 0.3), rotZ = matZ(0);
function setGeo(pr, tl, lv, px, view) {
  gl.useProgram(pr.p);
  gl.uniformMatrix3fv(pr.uRot, false, new Float32Array(rotW)); gl.uniformMatrix3fv(pr.uRotZ, false, new Float32Array(rotZ));
  gl.uniform1f(pr.uT, T); gl.uniform1f(pr.uLevel, lv); gl.uniform1f(pr.uGather, tl.gather); gl.uniform1f(pr.uBurst, tl.burst); gl.uniform1f(pr.uCore, Math.max(0.0001, tl.core * (1 + cur.beat * lv * 0.16)));
  gl.uniform1f(pr.uHeat, cur.heat); gl.uniform1f(pr.uAspect, W / H); gl.uniform1f(pr.uScale, 0.7); gl.uniform1f(pr.uPx, px); gl.uniform1f(pr.uFade, tl.fade);
  gl.uniform2f(pr.uOff, 0, 0); gl.uniform1f(pr.uIsLine, pr === LNS ? 1 : 0); gl.uniform1f(pr.uView, view); gl.uniform1f(pr.uLineGain, 1);
  gl.uniform1f(pr.uListen, cur.listen);
  gl.uniform1f(pr.uPulseR, pulseR); gl.uniform1f(pr.uPulseA, pulseA);
}
function drawScene(tl, lv, glow) {
  const px = H * DPR / 760 / (glow ? 4 : 1), off = 2 / (H * DPR);
  const lines = (buf, view, count) => {
    setGeo(LNS, tl, lv, px, view); bind(buf);
    for (const [ox, oy, g] of glow ? [[0, 0, 0.9]] : [[0, 0, 0.9], [off, off * 0.5, 0.35]]) { gl.uniform2f(LNS.uOff, ox, oy); gl.uniform1f(LNS.uLineGain, g); gl.drawArrays(gl.LINES, 0, count); }
  };
  lines(BLW, 0, STATIC_LW + liveCount * 2); lines(BLV, 1, BLV.n);
  setGeo(PTS, tl, lv, px, 0); bind(BPW); gl.drawArrays(gl.POINTS, 0, BPW.n);
  setGeo(PTS, tl, lv, px, 1); bind(BPV); gl.drawArrays(gl.POINTS, 0, BPV.n);
}
let last = performance.now(), running = false;
function run() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const s = STATES[state]; for (const k in cur) cur[k] += (s[k] - cur[k]) * Math.min(1, dt * 2);
  level += (target - level) * Math.min(1, dt * (target > level ? 8 : 3));   // a soft, even glow with the voice
  flash *= Math.exp(-dt * 2.6);
  noteVoice(dt);
  const tl = timeline(), lv = Math.min(1, (phase === 'on' ? level : 0) + flash * 0.3);
  spinAng += dt * cur.spin; ringAng += dt * cur.ring; coreClock += dt * cur.core * (1 + lv * 0.6); gaugeClock += dt * (0.4 + cur.spin * 2);
  rotW = mat(spinAng, 0.3); rotZ = matZ(ringAng);
  if (pulse) { const k = (T - pulse.at) / pulse.secs; if (k >= 1) { pulse = null; pulseA = 0; } else { pulseR = pulse.from + (pulse.to - pulse.from) * ease(k); pulseA = pulse.strength * Math.sin(Math.PI * Math.min(1, k * 1.15)); } }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height); gl.clear(gl.COLOR_BUFFER_BIT);
  const R = H * 0.35, cx = W / 2, cy = H / 2;
  drawBack();
  if (phase !== 'off') {
    updateLive(coreClock, lv, Math.max(0.0001, tl.core * (1 + cur.beat * lv * 0.16)), tl.arcs);
    const bw = Math.max(1, Math.round(cv.width / 4)), bh = Math.max(1, Math.round(cv.height / 4));
    if (!BA || BA.w !== bw || BA.h !== bh) { BA = renderTarget(bw, bh); BB = renderTarget(bw, bh); }
    gl.bindFramebuffer(gl.FRAMEBUFFER, BA.f); gl.viewport(0, 0, bw, bh); gl.clear(gl.COLOR_BUFFER_BIT);
    drawScene(tl, lv, true);
    gl.disable(gl.BLEND);
    for (let i = 0; i < 2; i++) {
      quad(BLUR, BB, BA, () => gl.uniform2f(BLUR.uDir, (1.5 + i) / bw, 0));
      quad(BLUR, BA, BB, () => gl.uniform2f(BLUR.uDir, 0, (1.5 + i) / bh));
    }
    gl.enable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height);
    drawScene(tl, lv, false);
    quad(COMP, null, BA, () => gl.uniform1f(COMP.uGain, 0.75 + lv * 0.3));
  }
  drawHud(R, cx, cy, tl);
  if (phase === 'off' && flash < 0.01) { running = false; hx.clearRect(0, 0, W, H); hb.clearRect(0, 0, W, H); return; }   // asleep: stop drawing
  requestAnimationFrame(frame);
}
